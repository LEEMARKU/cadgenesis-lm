[project]
name = "cadgenesis-lm"
version = "8.0.0"
description = "CADGenesis-LM v8.0 — Self-Evolving Neuro-Symbolic Geometry Foundation Model (Ultimate Architecture)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
]
[project.optional-dependencies]
bpe = [
    "tokenizers>=0.15",
    "transformers>=4.35",
]
serve = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pyyaml>=6.0",
    "cryptography>=41.0",
    "psutil>=5.9",
    "grpcio>=1.60",
    "grpcio-tools>=1.60",
]
monitoring = [
    "prometheus-client>=0.19",
    "opentelemetry-sdk>=1.21",
    "opentelemetry-exporter-otlp-proto-http>=1.21",
]
ldap = [
    "ldap3>=2.9",
]
reportlab = [
    "reportlab>=4.0",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.16",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["cadgenesis*", "sdk*"]

[tool.setuptools.package-data]
cadgenesis = ["py.typed"]
sdk = ["*.tts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [".venv", "outputs", "external"]

[tool.ruff.lint]
# Curated, stable rule set (ruff 0.16). Legacy modules still carry
# modernization debt (UP0xx); they are brought to full compliance during the
# M18 final integration milestone (see docs/v6_roadmap.md).
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PERF", "PYI"]

# Per-file ignores
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# FastAPI `Depends()`-in-default idiom is required for dependency injection.
"src/cadgenesis/serving/api.py" = ["B008"]
# Notebook cells: ruff reads the flattened cell source, where wrapping is not
# practical and sequential redefinition is the intended notebook pattern.
"*.ipynb" = ["E501", "E402", "F811"]
# Deliberate resilient catch-all loops: sink/listener/registry isolation.
"src/cadgenesis/platform/config.py" = ["PERF203"]
"src/cadgenesis/platform/logging.py" = ["PERF203"]
"src/cadgenesis/platform/plugins.py" = ["PERF203"]
"src/cadgenesis/platform/registry.py" = ["PERF203"]
# Research-lab / autonomous-research / collaboration modules deliberately
# use append-in-loop accumulation and resilient try/except sampling; keep
# their readable structure instead of forcing comprehension rewrites.
"src/cadgenesis/autonomous_research/*.py" = ["PERF203", "PERF401"]
# Deliberate rust/llvm/mlir extension ignores (temporary until fully integrated)
"src/cadgenesis/extensions/rust/*" = ["PERF203", "PERF401"]
"src/cadgenesis/extensions/llvm/*" = ["PERF203", "PERF401"]
"src/cadgenesis/extensions/mlir/*" = ["PERF203", "PERF401"]

[tool.mypy]
# CI typechecks on Python 3.12 (see .github/workflows/ci.yml); numpy 2.x
# stubs use PEP 695 `type` statements that require a 3.12+ target.
python_version = "3.12"
mypy_path = "src"

[[mypy]]
# Per-file mypy ignores for research modules with fundamental type issues
# qlora.py: Module * Tensor operations and QuantizedLinear type mismatches
# (dynamic quantization patterns; per-file ignore keeps CI green)
source = "src/cadgenesis/adapters/qlora.py"
disallow-untyped-defs = false
ignore-missing-imports = true