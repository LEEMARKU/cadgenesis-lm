# CADGenesis-LM horizontal autoscaling (Pillar 11)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cadgenesis-serve
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cadgenesis-serve
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
