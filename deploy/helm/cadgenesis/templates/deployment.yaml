apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cadgenesis.fullname" . }}
  labels:
    {{- include "cadgenesis.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "cadgenesis.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cadgenesis.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: serve
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
              name: http
            - containerPort: 50051
              name: grpc
          env:
            - name: CADGENESIS_MODEL
              value: {{ .Values.model.path }}
            - name: CADGENESIS_REGISTRY
              value: {{ .Values.model.registry }}
            - name: CADGENESIS_ADMIN_USER
              value: {{ .Values.auth.adminUser | quote }}
            - name: CADGENESIS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret }}
                  key: {{ .Values.auth.adminPasswordKey }}
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
            - name: config
              mountPath: /app/configs
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: models
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "cadgenesis.fullname" . }}-models
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: config
          configMap:
            name: {{ include "cadgenesis.fullname" . }}-config
